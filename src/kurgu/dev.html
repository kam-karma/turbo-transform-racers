<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <title>Kurgu dev</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e3c4; font-family: system-ui, sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #info { position: fixed; left: 8px; top: 8px; font: 12px monospace; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; z-index: 3; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      #hud .top { position: absolute; right: 12px; top: 10px; color: #fff; font: 800 18px system-ui; text-shadow: 0 2px 0 rgba(0,0,0,.4); text-align: right; }
      #hud .pop { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); font: 900 42px system-ui; color: #fff; text-shadow: 0 3px 0 #b05; }
      #hud .cd { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font: 900 96px system-ui; color: #fff; text-shadow: 0 4px 0 #b05; }
      #hud .panel { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); }
      #hud .flash { position: absolute; inset: 0; opacity: 0; transition: opacity .3s; }
      #hud .meter { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: 240px; height: 16px; border-radius: 8px; background: rgba(0,0,0,.3); overflow: hidden; }
      #hud .meter i { display: block; height: 100%; width: 0; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"><div class="flash"></div><div class="top"></div><div class="pop"></div><div class="cd"></div><div class="panel"></div></div>
    <div id="info"></div>
    <script type="module" src="./src/kurgu/dev.ts"></script>
  </body>
</html>
