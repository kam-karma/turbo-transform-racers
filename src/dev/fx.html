<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX + audio test bench</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #6fc3ff; font: 13px system-ui, sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; top: 8px; left: 8px; width: 250px; max-height: calc(100% - 16px); overflow: auto; background: rgba(20, 30, 50, 0.82); color: #fff; padding: 8px 10px; border-radius: 10px; }
      #panel h3 { margin: 6px 0 4px; font-size: 12px; text-transform: uppercase; opacity: 0.7; }
      #panel button { margin: 2px; padding: 4px 7px; border: 0; border-radius: 6px; background: #ffd23f; color: #222; cursor: pointer; font-weight: 600; }
      #panel button.snd { background: #7dd3ff; }
      #panel label { display: block; margin: 3px 0; }
      #panel input[type=range] { width: 130px; vertical-align: middle; }
      #stats { font: 11px monospace; opacity: 0.85; margin-top: 6px; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel"></div>
    <script type="module" src="./fx.ts"></script>
  </body>
</html>
